[package]
name = "cppr_cosserat_wasm"
version = "0.1.0"
edition = "2021"
description = "WASM wrapper for the CPPR Cosserat rod solver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.35"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
